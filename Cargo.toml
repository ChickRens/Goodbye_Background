[package]
name = "Goodbye_Background"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "0.8", features = ["serde", "v4"] }
reqwest = { version = "0.12", features = ["json"] }
image = "0.25"
webp = "0.3"
ort = "2.0.0-rc.2"
ndarray = "0.17.2"
bytemuck = "1"
axum={ version="0.8.9", features = ["multipart", "macros"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.0", features = ["fs"] }
fs = "0.0.5"
serde = { version = "1.0.229", features = ["derive"] }
rayon = "1"
fast_image_resize = { version = "6.0", features = ["rayon"]}
dashmap = { version = "4.0", features = ["rayon"] }
sqlx = { version = "0.9", features = ["postgres", "sqlite", "runtime-tokio"] }
