services:
  goodbye-background:
    environment: 
      DATABASE_URL_POSTGRES: ${DATABASE_URL_POSTGRES}
      DATABASE_URL_SQLITE: ${DATABASE_URL_SQLITE}
    build:
      context: .
      dockerfile: DockerFile
    ports:
      - "3000:3000"
    volumes:
      - ./database:/app/database:rw
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # read_only: true
    tmpfs:
      - /tmp
